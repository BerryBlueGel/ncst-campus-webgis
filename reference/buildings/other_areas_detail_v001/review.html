<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全校独立细化预览 · 非实测</title>
<style>body{margin:0;background:#d9edf8;color:#173956;font:14px system-ui}header{position:absolute;z-index:2;left:12px;top:12px;background:#eff8fff2;padding:14px;border:1px solid #9bc9e6;border-radius:12px;max-width:calc(100% - 52px)}button{margin:6px 5px 0 0;padding:7px 12px;background:white;border:1px solid #9bc9e6;border-radius:6px;color:#174268}#status{margin:6px 0}canvas{display:block}</style>
<header><strong>全校独立细化预览（非实测，不是线上版本）</strong><div id="status">正在加载真实组装GLB…</div>
<div>124个源ID细化 · 12项证据缺口保留 · 楼高/门窗多为占位与示意</div>
<button id="all">整校斜视</button><button id="top">整校俯视</button><button id="southwest">西南学院区</button><button id="northeast">东北学院区</button><button id="teaching">中心教学区</button><button id="residential">竹园生活区</button>
<div id="camera">视角待加载</div><details><summary>验收指标</summary><button id="batch">树木批处理：开</button><button id="benchmark">固定视角测120帧</button><div id="performance">等待性能检查</div><pre id="metrics" style="max-height:240px;overflow:auto"></pre></details></header>
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/addons/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {hideDiagnosticContours,reviewLineCounts} from '/review-presentation.mjs';
import {instanceReviewTrees,createReviewRenderLoop} from '/review-performance.mjs';
const renderer=new THREE.WebGLRenderer({antialias:true,reversedDepthBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.append(renderer.domElement);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.8;
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9edf8');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,6000);camera.up.set(0,1,0);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=15;controls.maxDistance=4500;
scene.add(new THREE.HemisphereLight(0xffffff,0x778899,1.3));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(600,1000,300);scene.add(sun);
let loaded=false,interactions=0,treeBatch=null,renderedFrames=0,benchmark=null,benchmarkResult=null;
const errors=[];window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
function view(label,x,n,dx,dn,h){controls.enableDamping=false;controls.update();controls.target.set(x,4,-n);camera.position.set(x+dx,h,-n-dn);controls.update();controls.enableDamping=true;document.querySelector('#camera').textContent='当前视角：'+label;interactions++;loop.request();}
const views={all:['整校斜视',990,900,900,-1400,1400],top:['整校俯视',990,900,0,-10,2400],southwest:['西南学院区',540,330,180,-230,240],northeast:['东北学院区',1360,1490,220,-280,270],teaching:['中心教学区',990,1000,150,-220,240],residential:['竹园生活区',590,1120,150,-210,210]};
for(const [id,args] of Object.entries(views))document.getElementById(id).onclick=()=>view(...args);
controls.addEventListener('end',()=>{interactions++;document.querySelector('#camera').textContent='交互完成 · 距离 '+camera.position.distanceTo(controls.target).toFixed(1)+'m';});
const start=performance.now();new GLTFLoader().load('/model.glb',g=>{g.scene.rotation.x=-Math.PI/2;scene.add(g.scene);const ids=new Set();let roots=0,meshes=0,lines=0;
g.scene.traverse(o=>{if(o.isMesh){meshes++;let ground=false;for(let p=o;p;p=p.parent)if(/Ground/i.test(p.name))ground=true;if(ground){o.renderOrder=-100;const sign=renderer.capabilities.reversedDepthBuffer?-1:1;const cloned=(Array.isArray(o.material)?o.material:[o.material]).map(m=>{const c=m.clone();c.polygonOffset=true;c.depthWrite=false;c.polygonOffsetFactor=sign;c.polygonOffsetUnits=sign;return c;});o.material=Array.isArray(o.material)?cloned:cloned[0];}}
if(o.isLine)lines++;if(o.userData.feature_id&&!o.isMesh){roots++;ids.add(o.userData.feature_id);}});
hideDiagnosticContours(g.scene);const lineCounts=reviewLineCounts(g.scene);
treeBatch=instanceReviewTrees(g.scene,THREE);
loaded=true;view(...views.all);window.reviewResult={loaded,roots,uniqueIds:ids.size,meshes,...lineCounts,loadMs:performance.now()-start,reversedDepth:renderer.capabilities.reversedDepthBuffer};
document.querySelector('#status').textContent='GLB已加载 · '+ids.size+'个细化ID · '+lineCounts.visibleRoadLines+'条道路线 · '+lineCounts.hiddenContourLines+'条等高线已隐藏';
},undefined,e=>{errors.push(String(e));document.querySelector('#status').textContent='加载失败：'+e;});
window.getReviewState=()=>({...window.reviewResult,errors:[...errors],interactions,camera:camera.position.toArray(),target:controls.target.toArray(),viewport:[innerWidth,innerHeight],drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,renderedFrames,treeBatch:treeBatch?{...treeBatch.stats,enabled:treeBatch.enabled}:null,benchmark:benchmarkResult});
const quantile=(values,q)=>{const sorted=[...values].sort((a,b)=>a-b);return sorted[Math.floor((sorted.length-1)*q)];};
const loop=createReviewRenderLoop(now=>{
  const begin=performance.now(),changed=controls.update();renderer.render(scene,camera);renderedFrames++;
  const cpu=performance.now()-begin;
  if(benchmark){
    benchmark.frames++;
    if(benchmark.frames>20){benchmark.cpu.push(cpu);if(benchmark.last!==null)benchmark.intervals.push(now-benchmark.last);}
    benchmark.last=now;
    if(benchmark.frames===120){
      benchmarkResult={enabled:treeBatch.enabled,samples:benchmark.cpu.length,cpuMedianMs:quantile(benchmark.cpu,.5),cpuP95Ms:quantile(benchmark.cpu,.95),rafMedianMs:quantile(benchmark.intervals,.5),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
      document.querySelector('#performance').textContent='120帧完成 · '+benchmarkResult.drawCalls+'次绘制 · CPU提交中位 '+benchmarkResult.cpuMedianMs.toFixed(2)+'ms（非GPU帧耗时）';benchmark=null;
      document.querySelector('#benchmark').disabled=false;document.querySelector('#batch').disabled=false;for(const id of Object.keys(views))document.getElementById(id).disabled=false;controls.enabled=true;
    }
  }
  document.querySelector('#metrics').textContent=JSON.stringify(window.getReviewState(),null,2);
  return changed||Boolean(benchmark);
},callback=>requestAnimationFrame(callback),id=>cancelAnimationFrame(id));
controls.addEventListener('change',loop.request);
document.querySelector('#batch').onclick=()=>{if(!treeBatch||benchmark)return;treeBatch.setEnabled(!treeBatch.enabled);document.querySelector('#batch').textContent='树木批处理：'+(treeBatch.enabled?'开':'关');loop.request();};
document.querySelector('#benchmark').onclick=()=>{if(!loaded||benchmark)return;benchmark={frames:0,last:null,cpu:[],intervals:[]};benchmarkResult=null;controls.enabled=false;for(const id of Object.keys(views))document.getElementById(id).disabled=true;document.querySelector('#performance').textContent='正在测120帧…';document.querySelector('#benchmark').disabled=true;document.querySelector('#batch').disabled=true;loop.request();};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);loop.request();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)loop.pause();else loop.resume();});
window.addEventListener('pagehide',()=>{loop.dispose();controls.dispose();treeBatch?.dispose();renderer.dispose();},{once:true});
loop.request();
</script></html>
