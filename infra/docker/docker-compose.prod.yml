name: campus-webgis

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_webgis}
      POSTGRES_USER: ${DB_USERNAME:-campus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in infra/docker/.env}
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    networks:
      - database_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: campus-webgis-backend:${RELEASE_ID:-local}
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    mem_limit: 1200m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-campus_webgis}
      DB_USERNAME: ${DB_USERNAME:-campus}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in infra/docker/.env}
      CAMPUS_DATA_ROOT: /app/data
      CAMPUS_IMPORT_ON_START: ${CAMPUS_IMPORT_ON_START:-true}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - database_net
      - edge_net
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: campus-webgis-web:${RELEASE_ID:-local}
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_FEATURE_SOURCE: api
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-80}:80"
    volumes:
      - ../acme:/var/www/certbot:ro
    depends_on:
      backend: { condition: service_healthy }
    networks:
      - edge_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  database_net: { internal: true }
  edge_net: {}

volumes:
  campus_postgres_data: {}
