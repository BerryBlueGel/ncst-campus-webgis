services:
  nginx:
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/conf.d/campus-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
